  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-sp)"/>
  <rect x="20" y="20" width="760" height="410" rx="16" fill="#0E1626" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
  
