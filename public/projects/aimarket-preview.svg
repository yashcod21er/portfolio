<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B16"/>
      <stop offset="100%" stop-color="#0F1F38"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-ai)"/>
  <rect x="20" y="20" width="760" height="410" rx="16" fill="#10182B" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <text x="50" y="60" fill="#38BDF8" font-family="'Orbitron', sans-serif" font-weight="bold" font-size="20">AI STOCK INTELLIGENCE</text>
  <text x="50" y="82" fill="#94A3B8" font-family="system-ui" font-size="13">Algorithmic Financial Trend Analysis &amp; Technical Indicators</text>
  
  <rect x="620" y="42" width="130" height="24" rx="12" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
  <text x="650" y="58" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PLANNED</text>
  
  <!-- Financial Chart Canvas Simulator -->
  <rect x="50" y="105" width="700" height="240" rx="10" fill="#080B16" stroke="#1E293B"/>
  <!-- Grid Lines -->
  <line x1="50" y1="160" x2="750" y2="160" stroke="#1E293B" stroke-dasharray="4 4"/>
  <line x1="50" y1="220" x2="750" y2="220" stroke="#1E293B" stroke-dasharray="4 4"/>
  <line x1="50" y1="280" x2="750" y2="280" stroke="#1E293B" stroke-dasharray="4 4"/>
  
  <!-- Chart Line -->
  <path d="M70 290 Q 150 250, 220 270 T 350 180 T 480 210 T 600 140 T 730 130" fill="none" stroke="#39DFFF" stroke-width="3"/>
  <path d="M70 310 Q 150 280, 220 290 T 350 220 T 480 240 T 600 170 T 730 160" fill="none" stroke="#9B7BFF" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Candlestick bars simulation -->
  <rect x="180" y="240" width="12" height="35" rx="2" fill="#10B981" opacity="0.8"/>
  <rect x="300" y="190" width="12" height="40" rx="2" fill="#10B981" opacity="0.8"/>
  <rect x="420" y="215" width="12" height="25" rx="2" fill="#EF4444" opacity="0.8"/>
  <rect x="550" y="150" width="12" height="45" rx="2" fill="#10B981" opacity="0.8"/>

  <!-- Metric Badges -->
  <rect x="50" y="365" width="210" height="45" rx="8" fill="#111D3A"/>
  <text x="65" y="385" fill="#64748B" font-family="'JetBrains Mono'" font-size="11">VOLATILITY INDEX</text>
  <text x="65" y="402" fill="#39DFFF" font-family="'JetBrains Mono'" font-weight="bold" font-size="14">HISTORICAL REGRESSION</text>

  <rect x="290" y="365" width="210" height="45" rx="8" fill="#111D3A"/>
  <text x="305" y="385" fill="#64748B" font-family="'JetBrains Mono'" font-size="11">INDICATOR SUITE</text>
  <text x="305" y="402" fill="#9B7BFF" font-family="'JetBrains Mono'" font-weight="bold" font-size="14">EMA / RSI SIMULATION</text>

  <rect x="530" y="365" width="220" height="45" rx="8" fill="#111D3A"/>
  <text x="545" y="385" fill="#64748B" font-family="'JetBrains Mono'" font-size="11">SYSTEM TARGET</text>
  <text x="545" y="402" fill="#10B981" font-family="'JetBrains Mono'" font-weight="bold" font-size="14">HIGH-FREQUENCY QUOTES</text>
</svg>
